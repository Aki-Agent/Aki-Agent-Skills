<!doctype html>
<!-- Ring gauge that fills to a share and counts up, with a label: "92% accuracy", "8 of 10".
     Use only figures the video states. See components/README.md.
     Params: value (required), max (default 100), suffix (default "%"; "" for none), display (fixed text in the ring),
             decimals, locale, kicker, label, text, icon, count (seconds the fill takes, default 1.2),
             top (default .015), x (horizontal center of the card, default .5), theme, accent, ink, muted, card, font, dur
             vars: {"track": "rgba(255,255,255,.15)"} for the empty part of the ring -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="overlay.css">
<style>
  :root { --top: .015; --x: .5; --track: rgba(127, 127, 127, .25); }
  /* The card is as wide as its content and centered on "x"; .life is on the card, not on this transformed slot. */
  .slot { position: absolute; left: calc(var(--x) * 100%); top: calc(var(--top) * 100%); transform: translateX(-50%); width: max-content; max-width: 88vw; }
  .card { background: var(--card); border-radius: 3vmin; padding: 2.6vmin 4vmin 2.6vmin 2.8vmin; display: flex; align-items: center; gap: 3.4vmin;
    box-shadow: 0 .8vmin 2.4vmin rgba(0, 0, 0, .35); }
  .ring { position: relative; width: 24vmin; height: 24vmin; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 11; stroke-linecap: round; }
  .ring .track { stroke: var(--track); }
  .ring .fill { stroke: var(--accent); }
  .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 6.6vmin; font-weight: 900;
    color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .info { min-width: 0; max-width: 46vmin; }
  .kicker { display: flex; align-items: center; gap: 1.2vmin; color: var(--accent); font-size: 3.1vmin; font-weight: 800; letter-spacing: .3vmin; text-transform: uppercase; }
  .kicker .ic { width: 3.8vmin; height: 3.8vmin; }
  .label { font-size: 5vmin; font-weight: 900; line-height: 1.1; margin-top: .6vmin; }
  .text { font-size: 3.4vmin; color: var(--muted); line-height: 1.25; margin-top: .6vmin; }
</style></head>
<body>
  <div class="slot"><div class="card life">
    <div class="ring"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="42"/>
      <circle class="fill" cx="50" cy="50" r="42" pathLength="100" stroke-dasharray="0 100"/></svg><div class="num"></div></div>
    <div class="info">
      <div class="kicker"><span class="ic" data-icon="icon"></span><span data-p="kicker"></span></div>
      <div class="label" data-p="label"></div>
      <div class="text" data-p="text"></div>
    </div>
  </div></div>
  <script src="overlay.js"></script>
  <script>
    const p = window.OVERLAY.params;
    const max = +p.max || 100, value = +p.value || 0, secs = +p.count || 1.2;
    const share = Math.max(0, Math.min(1, value / max));
    const suffix = p.suffix ?? '%';
    const fmt = new Intl.NumberFormat(p.locale || 'es-AR', { minimumFractionDigits: +p.decimals || 0, maximumFractionDigits: +p.decimals || 0 });
    const fill = document.querySelector('.fill'), num = document.querySelector('.num');
    const t0 = performance.now();
    // Ease-out fill and count on the renderer's virtual clock; starts after the card has entered.
    const tick = () => {
      const k = Math.max(0, Math.min(1, ((performance.now() - t0) / 1000 - 0.35) / secs));
      const e = 1 - Math.pow(1 - k, 3);
      // A zero-length dash with round caps still paints a dot: hide it until the fill starts.
      fill.setAttribute('stroke-dasharray', `${share * 100 * e} 100`);
      fill.style.opacity = e > 0 ? 1 : 0;
      num.textContent = p.display ?? fmt.format(value * e) + suffix;
      if (k < 1) requestAnimationFrame(tick);
    };
    tick();
  </script>
</body></html>
