<!doctype html>
<!-- Key-point card. Params: kicker, title, text, figure, icon, top (0-1 share of height), accent, dur -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="overlay.css">
<style>
  .slot { position: absolute; left: 6%; right: 6%; top: calc(var(--top) * 100%); display: flex; justify-content: center; }
  /* Sized to fit the free band above a talking head: on the 720x1280 test recording the head
     starts at 240 px, and the first version (6.6vmin titles, 17vmin figures, 6vmin shadow)
     reached 320-400 px and covered the eyes. Measured at --top .015, shadow included: two
     title lines end at 214 px, a figure card at 237 px. */
  .card {
    background: var(--card); border-radius: 3vmin; padding: 2.6vmin 3.8vmin 3vmin;
    border-left: 1.4vmin solid var(--accent); box-shadow: 0 .8vmin 2.4vmin rgba(0, 0, 0, .35);
    max-width: 100%;
  }
  .kicker { display: flex; align-items: center; gap: 1.4vmin; color: var(--accent);
    font-size: 3.2vmin; font-weight: 800; letter-spacing: .3vmin; text-transform: uppercase; }
  .kicker .ic { width: 4vmin; height: 4vmin; flex: none; }
  .figure { font-size: 10.5vmin; font-weight: 900; line-height: .95; color: var(--accent); margin-top: .8vmin; }
  .title { font-size: 5.4vmin; font-weight: 800; line-height: 1.12; margin-top: 1vmin; }
  .text { font-size: 3.8vmin; color: var(--muted); line-height: 1.25; margin-top: .8vmin; }
  .bar { height: .7vmin; background: var(--accent); border-radius: 1vmin; margin-top: 1.6vmin;
    transform-origin: left; animation: grow .9s cubic-bezier(.3, .8, .2, 1) .25s both; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
</style></head>
<body>
  <div class="slot"><div class="card life">
    <div class="kicker"><span class="ic" data-icon="icon"></span><span data-p="kicker"></span></div>
    <div class="figure" data-p="figure"></div>
    <div class="title" data-p="title"></div>
    <div class="text" data-p="text"></div>
    <div class="bar"></div>
  </div></div>
  <script src="overlay.js"></script>
</body></html>
