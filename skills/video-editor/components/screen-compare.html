<!doctype html>
<!-- Full-frame comparison table: features in rows, 2-3 options in columns. Replaces the footage.
     See components/README.md ("Screens").
     Params: columns ["Option A", "Option B"] (2-3 names), rows [{label, values: [...], at}]
               values: true = check (green), false = cross (red), a string or number = that text
             best (column index drawn in accent as the recommended one), title, kicker, icon, text,
             note, source, theme, accent, bg, panel, pattern, font, dur
             vars: {"good": "#00c853", "bad": "#d50000"} to change the check and cross colors -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="overlay.css">
<link rel="stylesheet" href="screen.css">
<style>
  .table { display: grid; grid-template-columns: minmax(0, 1.25fr) repeat(var(--n), minmax(0, 1fr)); column-gap: 1.6vmin; position: relative; }
  .colbg { grid-row: 1 / span var(--rows); border-radius: 2.4vmin; background: var(--panel); }
  .colbg.best { background: color-mix(in srgb, var(--accent) 16%, transparent); outline: .5vmin solid var(--accent); }
  .cell { display: flex; align-items: center; justify-content: center; text-align: center; padding: 2.2vmin 1vmin;
    font-size: 3.8vmin; font-weight: 800; line-height: 1.15; border-top: 1px solid color-mix(in srgb, var(--ink) 12%, transparent); }
  .cell.label { justify-content: flex-start; text-align: left; font-weight: 700; color: var(--muted); padding-left: 0; }
  .cell.headc { border-top: none; font-size: 4.2vmin; font-weight: 900; padding-top: 2.8vmin; }
  .cell.headc.best { color: var(--accent); }
  .cell .ic { width: 6vmin; height: 6vmin; }
  .cell .ic.good { color: var(--good); }
  .cell .ic.bad { color: var(--bad); }
  body.landscape .cell { font-size: 3.2vmin; padding: 1.6vmin 1vmin; }
  body.landscape .cell.headc { font-size: 3.6vmin; }
  body.landscape .cell .ic { width: 4.8vmin; height: 4.8vmin; }
</style></head>
<body>
  <div class="screen cols life">
    <div class="deco"></div>
    <div class="head rise">
      <div class="kicker"><span class="ic" data-icon="icon"></span><span data-p="kicker"></span></div>
      <div class="title" data-p="title"></div>
      <div class="text" data-p="text"></div>
    </div>
    <div class="body"><div class="table"></div></div>
    <div class="foot rise" style="--d: .9s"><span data-p="note"></span><span class="source" data-p="source"></span></div>
  </div>
  <script src="overlay.js"></script>
  <script src="screen.js"></script>
  <script>
    const { params: p, icon, el, at } = window.SCREEN;
    const columns = p.columns || [];
    const rows = p.rows || [];
    const best = p.best !== undefined ? +p.best : -1;
    const table = document.querySelector('.table');
    table.style.setProperty('--n', columns.length);
    table.style.setProperty('--rows', rows.length + 1);
    // Column backgrounds sit behind the cells in the same grid tracks.
    columns.forEach((_, c) => {
      const bg = table.appendChild(el('div', 'colbg rise' + (c === best ? ' best' : '')));
      bg.style.gridColumn = c + 2;
      bg.style.setProperty('--d', '.3s');
    });
    const put = (node, row, col, delay) => {
      node.style.gridRow = row; node.style.gridColumn = col;
      node.classList.add('rise'); node.style.setProperty('--d', delay + 's');
      table.appendChild(node);
    };
    columns.forEach((name, c) => put(el('div', 'cell headc' + (c === best ? ' best' : ''), name), 1, c + 2, 0.35));
    rows.forEach((row, r) => {
      const delay = at(row, r, 0.6, 0.3);
      put(el('div', 'cell label', row.label), r + 2, 1, delay);
      columns.forEach((_, c) => {
        const value = (row.values || [])[c];
        const cell = el('div', 'cell');
        if (value === true || value === false) {
          const mark = cell.appendChild(el('span', 'ic ' + (value ? 'good' : 'bad')));
          mark.innerHTML = icon(value ? 'check' : 'x');
        } else cell.textContent = value ?? '';
        put(cell, r + 2, c + 2, delay + 0.08 * (c + 1));
      });
    });
  </script>
</body></html>
