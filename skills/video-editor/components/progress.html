<!doctype html>
<!-- Labeled progress bar that fills and counts up: "Downloading model 72%", "Step 3 of 5".
     See components/README.md.
     Params: value (required), max (default 100), label, kicker, icon, suffix (default "%"), display (fixed text),
             decimals, locale, fill (seconds the fill takes, default 1.6), striped (default true),
             top (default .015), x (horizontal center, default .5), w (width share; .88 vertical, .55 horizontal), theme, accent, ink, muted, card, font, dur -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="overlay.css">
<style>
  :root { --top: .015; --x: .5; --w: .88; }
  @media (orientation: landscape) { :root { --w: .55; } }
  .slot { position: absolute; left: calc((var(--x) - var(--w) / 2) * 100%); width: calc(var(--w) * 100%); top: calc(var(--top) * 100%); }
  .card { background: var(--card); border-radius: 3vmin; padding: 2.6vmin 3.4vmin 3vmin; box-shadow: 0 .8vmin 2.4vmin rgba(0, 0, 0, .35); }
  .kicker { display: flex; align-items: center; gap: 1.2vmin; color: var(--accent); font-size: 3.1vmin; font-weight: 800; letter-spacing: .3vmin; text-transform: uppercase; }
  .kicker .ic { width: 3.8vmin; height: 3.8vmin; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 2vmin; margin-top: .6vmin; }
  .label { font-size: 4.6vmin; font-weight: 900; line-height: 1.15; }
  .num { font-size: 5.4vmin; font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .track { margin-top: 1.6vmin; height: 4.4vmin; border-radius: 99vmin; background: rgba(127, 127, 127, .25); overflow: hidden; }
  .bar { height: 100%; width: 0; border-radius: 99vmin; background-color: var(--accent); }
  body.striped .bar { background-image: linear-gradient(45deg, rgba(255, 255, 255, .22) 25%, transparent 25%, transparent 50%,
      rgba(255, 255, 255, .22) 50%, rgba(255, 255, 255, .22) 75%, transparent 75%);
    background-size: 5vmin 5vmin; animation: stripes .8s linear infinite; }
  @keyframes stripes { from { background-position: 0 0; } to { background-position: 5vmin 0; } }
</style></head>
<body>
  <div class="slot"><div class="card life">
    <div class="kicker"><span class="ic" data-icon="icon"></span><span data-p="kicker"></span></div>
    <div class="top"><div class="label" data-p="label"></div><div class="num"></div></div>
    <div class="track"><div class="bar"></div></div>
  </div></div>
  <script src="overlay.js"></script>
  <script>
    const p = window.OVERLAY.params;
    if (p.striped !== false) document.body.classList.add('striped');
    const max = +p.max || 100, value = +p.value || 0, secs = +p.fill || 1.6;
    const share = Math.max(0, Math.min(1, value / max));
    const suffix = p.suffix ?? '%';
    const fmt = new Intl.NumberFormat(p.locale || 'es-AR', { minimumFractionDigits: +p.decimals || 0, maximumFractionDigits: +p.decimals || 0 });
    const bar = document.querySelector('.bar'), num = document.querySelector('.num');
    const t0 = performance.now();
    const tick = () => {
      const k = Math.max(0, Math.min(1, ((performance.now() - t0) / 1000 - 0.35) / secs));
      const e = 1 - Math.pow(1 - k, 2);
      bar.style.width = share * 100 * e + '%';
      num.textContent = p.display ?? fmt.format(value * e) + suffix;
      if (k < 1) requestAnimationFrame(tick);
    };
    tick();
  </script>
</body></html>
