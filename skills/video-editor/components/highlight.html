<!doctype html>
<!-- Draws a ring (or box) around something in the footage and points at it with a labeled arrow:
     a button in a screen recording, a detail on a product, a number on a slide. See components/README.md.
     Params: x, y (0-1 center of the target, required), r (ring radius as share of the short side, default .08),
             shape ("circle" | "box"), bw, bh (box width/height as shares of the frame, for shape "box"),
             label, from ("left" | "right" | "top" | "bottom": where the label sits, default "top"),
             accent, ink, card, dur -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="overlay.css">
<style>
  :root { --enter: enter-fade; --leave: leave-only-fade; --in: .2s; }
  svg.draw { position: absolute; inset: 0; overflow: visible; }
  .stroke { fill: none; stroke: var(--accent); stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 .4vmin 1vmin rgba(0, 0, 0, .6)); }
  .ring { animation: draw .7s cubic-bezier(.5, 0, .2, 1) .1s both; }
  .arrow { animation: draw .45s ease-out .7s both; }
  .label { position: absolute; transform: translate(-50%, -50%); background: var(--card); color: var(--ink); white-space: nowrap;
    font-size: 4vmin; font-weight: 800; padding: 1.2vmin 2.4vmin; border-radius: 1.4vmin; border: .4vmin solid var(--accent);
    animation: enter-pop .4s .95s both; }
  @keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
</style></head>
<body>
  <div class="life">
    <svg class="draw"><path class="stroke ring"/><path class="stroke arrow"/></svg>
    <div class="label"></div>
  </div>
  <script src="overlay.js"></script>
  <script>
    const p = window.OVERLAY.params;
    const W = innerWidth, H = innerHeight, S = Math.min(W, H);
    const cx = (p.x ?? .5) * W, cy = (p.y ?? .5) * H, sw = S * .012;
    document.querySelector('svg').setAttribute('viewBox', `0 0 ${W} ${H}`);
    const ring = document.querySelector('.ring'), arrow = document.querySelector('.arrow');
    let rx, ry;
    if (p.shape === 'box') {
      rx = (p.bw ?? .3) * W / 2; ry = (p.bh ?? .1) * H / 2;
      const r = Math.min(rx, ry) * .25;
      ring.setAttribute('d', `M${cx - rx + r} ${cy - ry} H${cx + rx - r} Q${cx + rx} ${cy - ry} ${cx + rx} ${cy - ry + r}
        V${cy + ry - r} Q${cx + rx} ${cy + ry} ${cx + rx - r} ${cy + ry} H${cx - rx + r} Q${cx - rx} ${cy + ry} ${cx - rx} ${cy + ry - r}
        V${cy - ry + r} Q${cx - rx} ${cy - ry} ${cx - rx + r} ${cy - ry} Z`);
    } else {
      rx = ry = (p.r ?? .08) * S;
      // A slightly open, hand-drawn loop reads as "look here" better than a perfect circle.
      ring.setAttribute('d', `M${cx + rx} ${cy} A${rx} ${ry} 0 1 1 ${cx + rx * .96} ${cy - ry * .28}`);
    }
    ring.style.strokeWidth = sw;
    const from = p.from || 'top', gap = S * .2;
    const dir = { top: [0, -1], bottom: [0, 1], left: [-1, 0], right: [1, 0] }[from] || [0, -1];
    const lx = cx + dir[0] * (rx + gap), ly = cy + dir[1] * (ry + gap);
    const ax = cx + dir[0] * (rx + sw * 2), ay = cy + dir[1] * (ry + sw * 2);
    const sx = cx + dir[0] * (rx + gap * .55), sy = cy + dir[1] * (ry + gap * .55);
    const hx = dir[0] ? dir[0] * S * .03 : S * .025, hy = dir[1] ? dir[1] * S * .03 : S * .025;
    arrow.setAttribute('d', `M${sx} ${sy} L${ax} ${ay} M${ax + (dir[0] ? hx : -hx)} ${ay + (dir[1] ? hy : hy)} L${ax} ${ay}
      L${ax + (dir[0] ? hx : hx)} ${ay + (dir[1] ? hy : -hy)}`);
    arrow.style.strokeWidth = sw;
    for (const el of [ring, arrow]) { const len = el.getTotalLength(); el.style.strokeDasharray = len; el.style.setProperty('--len', len); }
    const label = document.querySelector('.label');
    if (p.label) { label.textContent = p.label; label.style.left = lx + 'px'; label.style.top = ly + 'px'; }
    else { label.remove(); arrow.remove(); }
  </script>
</body></html>
