<!doctype html>
<!-- Full-frame description screen: a heading, a paragraph, a list of details (spec sheet) and an
     optional image. Replaces the footage. Vertical: image on top, text below. Horizontal: image
     on the left, text on the right. See components/README.md ("Screens").
     Params: title (required), kicker, icon, text (the description, 1-3 sentences),
             items [{label, text, icon, at}] (details: "RAM" / "16 GB"; without label it is a bullet),
             src (image path, relative to the plan), caption (under the image), tag (label over the image),
             fit ("cover" default | "contain" for screenshots that must not be cropped),
             note, source, theme, accent, bg, panel, pattern, font, dur -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="overlay.css">
<link rel="stylesheet" href="screen.css">
<style>
  .screen { gap: 3.4vmin; }
  .layout { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 4vmin; }
  body.landscape .layout { flex-direction: row; gap: 6vmin; }
  /* Vertical: the text takes the height it needs and the image fills what is left (at least 22%),
     so a long description shrinks the image instead of pushing the caption over the title. */
  .media { position: relative; flex: 1 1 0; min-height: 22vh; display: flex; flex-direction: column; gap: 1.4vmin; }
  body.portrait .info { flex: none; }
  body.portrait .layout.text-only .info { flex: 1; }
  body.landscape .media { flex: 0 0 46%; min-height: 0; }
  .frame { position: relative; flex: 1; min-height: 0; border-radius: 3vmin; overflow: hidden; background: var(--panel); }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: var(--fit, cover);
    animation: push var(--dur) linear both; }
  @keyframes push { from { transform: scale(1); } to { transform: scale(1.06); } }
  .tag { position: absolute; left: 2.4vmin; top: 2.4vmin; background: var(--accent); color: #111; font-weight: 800;
    font-size: 3vmin; padding: .8vmin 2vmin; border-radius: 1.2vmin; text-transform: uppercase; letter-spacing: .2vmin; }
  .caption { font-size: 3vmin; color: var(--muted); }
  .info { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 3vmin; }
  .list { list-style: none; display: flex; flex-direction: column; gap: 1.6vmin; }
  .list li { display: flex; align-items: center; gap: 2.4vmin; padding: 2vmin 2.6vmin; }
  .list .ic { width: 5.6vmin; height: 5.6vmin; flex: none; color: var(--accent); }
  .list .dot { width: 1.8vmin; height: 1.8vmin; flex: none; border-radius: 50%; background: var(--accent); }
  .list .lab { font-size: 3.6vmin; color: var(--muted); font-weight: 700; }
  .list .txt { font-size: 4vmin; font-weight: 800; line-height: 1.2; }
  .list .pair { flex: 1; min-width: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 2vmin; }
  .list .pair .txt { text-align: right; }
  body.landscape .list .lab { font-size: 3.2vmin; }
  body.landscape .list .txt { font-size: 3.4vmin; }
</style></head>
<body>
  <div class="screen life">
    <div class="deco"></div>
    <div class="layout">
      <div class="media rise">
        <div class="frame"><img data-src="src"><span class="tag" data-p="tag"></span></div>
        <div class="caption" data-p="caption"></div>
      </div>
      <div class="info">
        <div class="head rise" style="--d: .2s">
          <div class="kicker"><span class="ic" data-icon="icon"></span><span data-p="kicker"></span></div>
          <div class="title" data-p="title"></div>
          <div class="text" data-p="text"></div>
        </div>
        <ul class="list"></ul>
      </div>
    </div>
    <div class="foot rise" style="--d: .8s"><span data-p="note"></span><span class="source" data-p="source"></span></div>
  </div>
  <script>
    // The image is optional here: drop the media column before overlay.js reports a missing "src".
    const raw = JSON.parse(decodeURIComponent(location.hash.slice(1) || '{}'));
    if (!raw.src) {
      document.querySelector('.media').remove();
      document.querySelector('.layout').classList.add('text-only');
    }
  </script>
  <script src="overlay.js"></script>
  <script src="screen.js"></script>
  <script>
    const { params: p, icon, el, at } = window.SCREEN;
    if (p.fit) document.documentElement.style.setProperty('--fit', p.fit);
    const list = document.querySelector('.list');
    (p.items || []).forEach((item, i) => {
      const li = list.appendChild(el('li', 'tile rise'));
      li.style.setProperty('--d', at(item, i, 0.6, 0.3) + 's');
      const svg = icon(item.icon);
      if (svg) li.appendChild(el('span', 'ic')).innerHTML = svg;
      else li.appendChild(el('span', 'dot'));
      if (item.label) {
        const pair = li.appendChild(el('div', 'pair'));
        pair.append(el('span', 'lab', item.label), el('span', 'txt', item.text));
      } else li.appendChild(el('span', 'txt', item.text));
    });
  </script>
</body></html>
