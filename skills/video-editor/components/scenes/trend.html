<!doctype html>
<!-- Illustration for a screenshot card: a labeled trend chart. It is an illustration, so the
     default tag and note say so; never present it as real data.
     Params: title, subtitle, tag, note, points (values 0-1, left to right), color -->
<html><head><meta charset="utf-8"><style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Segoe UI", Arial, sans-serif; }
  body { background: #f6f7fb; padding: 5vmin 6vmin; color: #10131c; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 2vmin; }
  .t { font-size: 6vmin; font-weight: 900; }
  .tag { font-size: 3.2vmin; font-weight: 800; color: #fff; background: #10131c; padding: .8vmin 2vmin; border-radius: 1vmin; white-space: nowrap; }
  .s { font-size: 3.6vmin; color: #5b6275; margin-top: 1vmin; }
  svg { width: 100%; height: 62%; margin-top: 3vmin; }
  .note { font-size: 3vmin; color: #8a90a2; margin-top: 1vmin; }
</style></head>
<body>
  <div class="row"><div class="t"></div><div class="tag"></div></div>
  <div class="s"></div>
  <svg viewBox="0 0 600 260" preserveAspectRatio="none">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-opacity=".45"/><stop offset="1" stop-opacity="0"/></linearGradient></defs>
    <g stroke="#e3e6ee" stroke-width="1"><line x1="0" y1="65" x2="600" y2="65"/><line x1="0" y1="130" x2="600" y2="130"/><line x1="0" y1="195" x2="600" y2="195"/></g>
    <path class="area" fill="url(#g)"/><path class="line" fill="none" stroke-width="6" stroke-linejoin="round"/><circle class="dot" r="9"/>
  </svg>
  <div class="note"></div>
  <script>
    const p = JSON.parse(decodeURIComponent(location.hash.slice(1) || '{}'));
    const color = p.color || '#ff9500';
    document.querySelector('.t').textContent = p.title || '';
    document.querySelector('.tag').textContent = p.tag || 'ILLUSTRATION';
    document.querySelector('.s').textContent = p.subtitle || '';
    document.querySelector('.note').textContent = p.note || 'Illustrative chart, not real data';
    const pts = p.points || [.1, .14, .12, .23, .21, .35, .32, .5, .46, .69, .66, .88];
    const xy = pts.map((v, i) => [i * 600 / (pts.length - 1), 250 - v * 230]);
    const d = xy.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`).join(' ');
    document.querySelector('.line').setAttribute('d', d);
    document.querySelector('.line').setAttribute('stroke', color);
    document.querySelector('.area').setAttribute('d', `${d} L600 260 L0 260 Z`);
    document.querySelectorAll('stop').forEach(s => s.setAttribute('stop-color', color));
    const [lx, ly] = xy[xy.length - 1];
    Object.entries({ cx: lx, cy: ly, fill: color }).forEach(([k, v]) => document.querySelector('.dot').setAttribute(k, v));
  </script>
</body></html>
