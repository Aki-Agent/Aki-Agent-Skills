<!doctype html>
<!-- Illustration for a b-roll cutaway: competitors racing to one goal. Render it as a still
     (overlay_render.js job with "still": true) and pass the PNG to broll.html.
     Params: goal (big word), question, lanes [{label, letter, color, ahead (0-1)}] -->
<html><head><meta charset="utf-8"><style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Segoe UI", Arial, sans-serif; color: #fff; }
  body { background: radial-gradient(90% 50% at 50% 12%, #3b2a10 0%, transparent 70%), linear-gradient(#0c0f1a, #131a2c 55%, #0a0d16); }
  .goal { position: absolute; top: 20%; left: 0; right: 0; text-align: center; }
  .ring { width: 34vmin; height: 34vmin; margin: 0 auto; border-radius: 50%;
    background: radial-gradient(circle, #ffd27a 0%, #ffb020 40%, rgba(255, 176, 32, 0) 72%); }
  .word { position: absolute; top: 17vmin; left: 0; right: 0; transform: translateY(-50%); font-size: 12vmin; font-weight: 900; color: #1a1205; letter-spacing: .5vmin; }
  .question { margin-top: 2vmin; font-size: 4.4vmin; font-weight: 700; color: #ffd27a; }
  .track { position: absolute; left: 8%; right: 8%; top: 46%; bottom: 6%;
    background: repeating-linear-gradient(90deg, transparent 0 calc(33.33% - .5vmin), rgba(255, 255, 255, .12) calc(33.33% - .5vmin) 33.33%);
    clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%); }
  .lane { position: absolute; width: 30%; text-align: center; }
  .runner { margin: 0 auto; width: 15vmin; height: 15vmin; border-radius: 50%; display: grid; place-items: center;
    font-size: 6vmin; font-weight: 900; color: #fff; }
  .name { margin-top: 2vmin; font-size: 4.6vmin; font-weight: 800; }
  .trail { margin: 0 auto; width: 1.2vmin; height: 26vmin; border-radius: 1vmin; opacity: .6; }
</style></head>
<body>
  <div class="goal"><div class="ring"></div><div class="word"></div><div class="question"></div></div>
  <div class="track"></div>
  <script>
    const p = JSON.parse(decodeURIComponent(location.hash.slice(1) || '{}'));
    document.querySelector('.word').textContent = p.goal || 'GOAL';
    document.querySelector('.question').textContent = p.question || '';
    const lanes = p.lanes || [{ label: 'A', letter: 'A', color: '#4f8cff', ahead: .4 }, { label: 'B', letter: 'B', color: '#ff5c5c', ahead: .6 }, { label: 'C', letter: 'C', color: '#3ddc84', ahead: .3 }];
    lanes.forEach((lane, i) => {
      const el = document.createElement('div');
      el.className = 'lane';
      el.style.left = (7 + i * (86 / lanes.length)) + '%';
      el.style.width = (80 / lanes.length) + '%';
      el.style.bottom = (12 + (lane.ahead ?? .4) * 30) + '%';
      el.innerHTML = `<div class="runner" style="background:${lane.color};box-shadow:0 0 6vmin ${lane.color}"></div>
        <div class="name"></div><div class="trail" style="background:linear-gradient(${lane.color},transparent)"></div>`;
      el.querySelector('.runner').textContent = lane.letter || '';
      el.querySelector('.name').textContent = lane.label || '';
      document.body.appendChild(el);
    });
  </script>
</body></html>
