<!doctype html>
<!-- Section divider: a band wipes across with a chapter number and title, optionally dimming the footage.
     It covers the middle of the frame on purpose: use it on a pause or a new topic, 1.5-2.5 s long.
     See components/README.md.
     Params: title (required), number (e.g. "02"), sub, y (0-1 band center, default .5), dim (0-1 darkness behind, default .45),
             theme, accent, ink, card, dur -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="overlay.css">
<style>
  :root { --y: .5; --dim: .45; --enter: enter-fade; --leave: leave-only-fade; --in: .25s; --out: .3s; }
  .shade { position: absolute; inset: 0; background: rgba(0, 0, 0, var(--dim)); }
  .band { position: absolute; left: 0; right: 0; top: calc(var(--y) * 100%); transform: translateY(-50%);
    background: var(--card); padding: 3.4vmin 7vmin; display: flex; align-items: center; gap: 4vmin;
    clip-path: inset(0 100% 0 0); animation: wipe .55s cubic-bezier(.7, 0, .2, 1) .05s both; }
  .band::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1.6vmin; background: var(--accent); }
  .num { font-size: 15vmin; font-weight: 900; line-height: .9; color: var(--accent); font-variant-numeric: tabular-nums; }
  .title { font-size: 7vmin; font-weight: 900; line-height: 1.05; }
  .sub { font-size: 3.8vmin; font-weight: 600; color: var(--muted); margin-top: .8vmin; }
  .txt { animation: enter-up .45s .35s both; }
  @keyframes wipe { to { clip-path: inset(0 0 0 0); } }
</style></head>
<body>
  <div class="life">
    <div class="shade"></div>
    <div class="band"><div class="num" data-p="number"></div><div class="txt"><div class="title" data-p="title"></div><div class="sub" data-p="sub"></div></div></div>
  </div>
  <script src="overlay.js"></script>
  <script>
    const p = window.OVERLAY.params;
    if (p.dim !== undefined) document.documentElement.style.setProperty('--dim', p.dim);
  </script>
</body></html>
