<!doctype html>
<!-- Full-frame chart screen: horizontal bars, vertical columns or a line. Replaces the footage.
     Use only numbers the video states; if it is an illustration, say so in "note".
     See components/README.md ("Screens").
     Params: chart ("bars" default | "columns" | "line"), items [{label, value, display, color}],
             title, kicker, icon, text, note, source, prefix, suffix, decimals, max, highlight (index in accent,
             the others dimmed), locale, theme, accent, bg, panel, pattern, font, dur -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="overlay.css">
<link rel="stylesheet" href="screen.css">
<style>
  :root { --dim: color-mix(in srgb, var(--ink) 28%, transparent); }
  .chart { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
  .val { font-size: 4vmin; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; animation: enter-fade .3s both; }
  .fill { background: var(--c, var(--accent)); border-radius: 1.4vmin; }
  .fill.dim { background: var(--c, var(--dim)); }
  /* bars */
  .bars { display: flex; flex-direction: column; gap: 3vmin; }
  .bar .top { display: flex; justify-content: space-between; align-items: baseline; gap: 2vmin; margin-bottom: 1.2vmin; }
  .bar .lab { font-size: 4.2vmin; font-weight: 700; }
  .bar .track { height: 6vmin; border-radius: 1.4vmin; background: var(--panel); overflow: hidden; }
  .bar .fill { height: 100%; transform-origin: left; animation: grow-x .9s cubic-bezier(.3, .8, .2, 1) both; }
  /* Horizontal frames are short: label, bar and value share one row, so 6 bars still fit. */
  body.landscape .bars { gap: 2.4vmin; }
  body.landscape .bar { display: grid; grid-template-columns: minmax(0, 30%) minmax(0, 1fr); align-items: center; column-gap: 2.4vmin; }
  body.landscape .bar .top { display: contents; }
  body.landscape .bar .val { grid-column: 2; grid-row: 1; justify-self: end; z-index: 1; padding-right: 1.6vmin;
    font-size: 3.4vmin; text-shadow: 0 .3vmin 1vmin rgba(0, 0, 0, .5); }
  body.landscape .bar .lab { font-size: 3.4vmin; text-align: right; }
  body.landscape .bar .track { grid-column: 2; grid-row: 1; height: 5.6vmin; }
  /* columns */
  .cols-chart { flex: 1; min-height: 0; display: flex; align-items: stretch; gap: 3vmin; }
  .col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 1.2vmin; }
  .col .area { flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 1.2vmin; }
  .col .fill { width: 100%; transform-origin: bottom; animation: grow-y .9s cubic-bezier(.3, .8, .2, 1) both; }
  .col .lab { font-size: 3.4vmin; font-weight: 700; text-align: center; line-height: 1.15; }
  /* line */
  .plot { position: relative; flex: 1; min-height: 0; }
  .plot svg { position: absolute; inset: 0; overflow: visible; }
  .plot .grid line { stroke: var(--dim); stroke-width: 1; opacity: .5; vector-effect: non-scaling-stroke; }
  .plot .ln { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linejoin: round; stroke-linecap: round;
    vector-effect: non-scaling-stroke; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.4s ease-out .4s forwards; }
  .plot .ar { fill: color-mix(in srgb, var(--accent) 22%, transparent); animation: enter-fade .8s 1.2s both; }
  .dot { position: absolute; width: 2.6vmin; height: 2.6vmin; margin: -1.3vmin 0 0 -1.3vmin; border-radius: 50%;
    background: var(--accent); border: .6vmin solid var(--bg); animation: enter-pop .4s both; }
  .dot .val { position: absolute; bottom: 3vmin; left: 50%; transform: translateX(-50%); font-size: 3.4vmin; }
  /* Near the edges the value grows inwards, or the last point's value leaves the frame. */
  .dot .val.r { left: auto; right: -1vmin; transform: none; }
  .dot .val.l { left: -1vmin; transform: none; }
  .xlabels { display: flex; justify-content: space-between; margin-top: 2vmin; font-size: 3vmin; color: var(--muted); font-weight: 700; }
  @keyframes grow-x { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes grow-y { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
</style></head>
<body>
  <div class="screen cols life">
    <div class="deco"></div>
    <div class="head rise">
      <div class="kicker"><span class="ic" data-icon="icon"></span><span data-p="kicker"></span></div>
      <div class="title" data-p="title"></div>
      <div class="text" data-p="text"></div>
    </div>
    <div class="body"><div class="chart"></div></div>
    <div class="foot rise" style="--d: .8s"><span data-p="note"></span><span class="source" data-p="source"></span></div>
  </div>
  <script src="overlay.js"></script>
  <script src="screen.js"></script>
  <script>
    const { params: p, el, fmt } = window.SCREEN;
    const items = p.items || [];
    const chart = document.querySelector('.chart');
    const max = +p.max || Math.max(1, ...items.map(i => +i.value || 0));
    const shown = item => item.display ?? ((p.prefix || '') + fmt(+item.value || 0, p.decimals) + (p.suffix || ''));
    const dimmed = i => p.highlight !== undefined && +p.highlight !== i;
    const share = item => Math.max(0.02, Math.min(1, (+item.value || 0) / max));

    if ((p.chart || 'bars') === 'bars') {
      const box = chart.appendChild(el('div', 'bars'));
      items.forEach((item, i) => {
        const delay = 0.5 + i * 0.25;
        const row = box.appendChild(el('div', 'bar rise'));
        row.style.setProperty('--d', delay + 's');
        const top = row.appendChild(el('div', 'top'));
        top.appendChild(el('span', 'lab', item.label));
        const val = top.appendChild(el('span', 'val', shown(item)));
        val.style.animationDelay = (delay + 0.6) + 's';
        const fill = row.appendChild(el('div', 'track')).appendChild(el('div', 'fill' + (dimmed(i) ? ' dim' : '')));
        fill.style.width = share(item) * 100 + '%';
        fill.style.animationDelay = (delay + 0.1) + 's';
        if (item.color) fill.style.setProperty('--c', item.color);
      });
    } else if (p.chart === 'columns') {
      const box = chart.appendChild(el('div', 'cols-chart'));
      items.forEach((item, i) => {
        const delay = 0.5 + i * 0.2;
        const col = box.appendChild(el('div', 'col'));
        const area = col.appendChild(el('div', 'area'));
        const val = area.appendChild(el('span', 'val', shown(item)));
        val.style.animationDelay = (delay + 0.7) + 's';
        const fill = area.appendChild(el('div', 'fill' + (dimmed(i) ? ' dim' : '')));
        fill.style.height = share(item) * 82 + '%';
        fill.style.animationDelay = delay + 's';
        if (item.color) fill.style.setProperty('--c', item.color);
        col.appendChild(el('div', 'lab', item.label));
      });
    } else {
      // Line: an SVG stretched to the plot box (the stroke does not scale), dots and values as HTML.
      const min = p.min !== undefined ? +p.min : Math.min(0, ...items.map(i => +i.value || 0));
      const plot = chart.appendChild(el('div', 'plot'));
      const xy = items.map((item, i) => [items.length > 1 ? i / (items.length - 1) : 0.5,
        1 - ((+item.value || 0) - min) / ((max - min) || 1) * 0.9]);
      const d = xy.map(([x, y], i) => `${i ? 'L' : 'M'}${(x * 100).toFixed(2)} ${(y * 100).toFixed(2)}`).join(' ');
      plot.innerHTML = '<svg viewBox="0 0 100 100" preserveAspectRatio="none"><g class="grid">'
        + [25, 50, 75, 100].map(y => `<line x1="0" x2="100" y1="${y}" y2="${y}"/>`).join('')
        + `</g><path class="ar" d="${d} L100 100 L0 100 Z"/><path class="ln" pathLength="1" d="${d}"/></svg>`;
      xy.forEach(([x, y], i) => {
        const dot = plot.appendChild(el('div', 'dot'));
        Object.assign(dot.style, { left: x * 100 + '%', top: y * 100 + '%', animationDelay: (0.4 + 1.4 * x) + 's' });
        // Values only on the highlighted point, or on the last one: a value on every point is unreadable.
        if (p.highlight !== undefined ? +p.highlight === i : i === items.length - 1)
          dot.appendChild(el('span', 'val' + (x > 0.85 ? ' r' : x < 0.15 ? ' l' : ''), shown(items[i])));
      });
      const labels = chart.appendChild(el('div', 'xlabels'));
      items.forEach(item => labels.appendChild(el('span', '', item.label)));
    }
  </script>
</body></html>
