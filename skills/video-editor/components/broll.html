<!doctype html>
<!-- Full-frame cutaway: an example image replaces the footage with a slow zoom (Ken Burns).
     Params: src (required), caption, kicker, zoom_from, zoom_to, origin ("50% 50%"), accent, dur -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="overlay.css">
<style>
  :root { --enter: enter-fade; --leave: leave-only-fade; --in: .3s; --out: .3s; --z0: 1; --z1: 1.12; --origin: 50% 50%; }
  .frame { position: absolute; inset: 0; background: #000; overflow: hidden; }
  .img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    transform-origin: var(--origin); animation: kenburns var(--dur) linear both; }
  /* Linear on purpose: an eased zoom visibly accelerates and stops, a slow push should not. */
  @keyframes kenburns { from { transform: scale(var(--z0)); } to { transform: scale(var(--z1)); } }
  .tag { position: absolute; left: 6%; right: 6%; top: 5%; }
  .kicker { display: inline-block; background: var(--accent); color: #111; font-weight: 800; font-size: 3.4vmin;
    padding: .9vmin 2.2vmin; border-radius: 1.2vmin; text-transform: uppercase; letter-spacing: .2vmin; }
  .caption { margin-top: 1.6vmin; font-size: 6vmin; font-weight: 800; line-height: 1.12; text-shadow: 0 .6vmin 3vmin rgba(0, 0, 0, .8); }
  .shade { position: absolute; inset: 0 0 auto 0; height: 40%; background: linear-gradient(rgba(0, 0, 0, .65), transparent); }
</style></head>
<body>
  <div class="frame life">
    <img class="img" data-src="src">
    <div class="shade"></div>
    <div class="tag"><span class="kicker" data-p="kicker"></span><div class="caption" data-p="caption"></div></div>
  </div>
  <script>
    const p = JSON.parse(decodeURIComponent(location.hash.slice(1) || '{}'));
    const s = document.documentElement.style;
    if (p.zoom_from) s.setProperty('--z0', p.zoom_from);
    if (p.zoom_to) s.setProperty('--z1', p.zoom_to);
    if (p.origin) s.setProperty('--origin', p.origin);
    if (!p.kicker && !p.caption) document.querySelector('.shade').remove();
  </script>
  <script src="overlay.js"></script>
</body></html>
