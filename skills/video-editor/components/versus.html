<!doctype html>
<!-- Two options side by side with a "VS" badge: before/after, myth/fact, product A/product B.
     See components/README.md.
     Params: left {label, text, icon, tone}, right {label, text, icon, tone} (tone: "good" | "bad" | omitted),
             title, vs (badge text, default "VS"), top (default .015), bg, theme, accent, ink, card, dur -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="overlay.css">
<style>
  :root { --top: .015; --good: #3ddc84; --bad: #ff5c5c; }
  .slot { position: absolute; left: 5%; right: 5%; top: calc(var(--top) * 100%); }
  .title { text-align: center; font-size: 4.4vmin; font-weight: 900; margin-bottom: 1.4vmin; text-shadow: 0 .4vmin 2vmin rgba(0, 0, 0, .7); }
  .row { position: relative; display: flex; gap: 2.4vmin; }
  .side { flex: 1; background: var(--card); border-radius: 2.6vmin; padding: 2vmin 2.4vmin; border-top: 1vmin solid var(--tone, var(--accent));
    box-shadow: 0 .8vmin 2.4vmin rgba(0, 0, 0, .35); }
  .side.l { animation: from-l .5s cubic-bezier(.2, .9, .25, 1.1) both; }
  .side.r { animation: from-r .5s cubic-bezier(.2, .9, .25, 1.1) .15s both; }
  .side.good { --tone: var(--good); }
  .side.bad { --tone: var(--bad); }
  .head { display: flex; align-items: center; gap: 1.4vmin; color: var(--tone, var(--accent)); font-size: 4.6vmin; font-weight: 900; }
  .head .ic { width: 5vmin; height: 5vmin; flex: none; }
  .txt { font-size: 3.6vmin; color: var(--muted); font-weight: 600; line-height: 1.25; margin-top: 1vmin; }
  .vs { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 10vmin; height: 10vmin; border-radius: 50%;
    background: var(--accent); color: #111; font-weight: 900; font-size: 4vmin; display: grid; place-items: center;
    box-shadow: 0 0 0 1vmin rgba(0, 0, 0, .35); animation: enter-pop .5s .3s both; }
  @keyframes from-l { from { opacity: 0; transform: translateX(-8vmin); } to { opacity: 1; transform: none; } }
  @keyframes from-r { from { opacity: 0; transform: translateX(8vmin); } to { opacity: 1; transform: none; } }
</style></head>
<body>
  <div class="slot life">
    <div class="title" data-p="title"></div>
    <div class="row"><div class="side l"></div><div class="side r"></div><div class="vs"></div></div>
  </div>
  <script src="overlay.js"></script>
  <script>
    const { params: p, icon } = window.OVERLAY;
    document.querySelector('.vs').textContent = p.vs || 'VS';
    [['l', p.left || {}], ['r', p.right || {}]].forEach(([cls, s]) => {
      const el = document.querySelector('.side.' + cls);
      if (s.tone) el.classList.add(s.tone);
      el.innerHTML = `<div class="head">${s.icon ? `<span class="ic">${icon(s.icon)}</span>` : ''}<span></span></div><div class="txt"></div>`;
      el.querySelector('.head span:last-child').textContent = s.label || '';
      if (s.text) el.querySelector('.txt').textContent = s.text; else el.querySelector('.txt').remove();
    });
  </script>
</body></html>
