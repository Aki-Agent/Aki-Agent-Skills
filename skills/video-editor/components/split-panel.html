<!doctype html>
<!-- Explanatory half of a split layout. Rendered at the panel size, not the frame size:
     the top half of a vertical frame, or one side of a horizontal one.
     Params: kicker, title, items [{icon, text, at, tone}], accent, dur
       at   = seconds after the panel opens when the item appears (sync it to the word)
       tone = "good" | "bad" | omitted (accent) -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="overlay.css">
<style>
  :root { --enter: enter-up; --leave: leave-only-fade; --in: .45s; --good: #3ddc84; --bad: #ff5c5c; }
  .life { position: relative; }
  .panel { position: absolute; inset: 0; overflow: hidden;
    background: radial-gradient(120% 90% at 85% 0%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 60%),
                linear-gradient(160deg, #141826, #0a0c12 70%);
    padding: 7vmin 7vmin 5vmin; display: flex; flex-direction: column; }
  .grid { position: absolute; inset: 0; opacity: .08;
    background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px);
    background-size: 6vmin 6vmin; animation: pan var(--dur) linear both; }
  @keyframes pan { from { background-position: 0 0; } to { background-position: 0 6vmin; } }
  .kicker { position: relative; color: var(--accent); font-size: 3.6vmin; font-weight: 800; letter-spacing: .3vmin; text-transform: uppercase; }
  .title { position: relative; font-size: 7.4vmin; font-weight: 900; line-height: 1.08; margin-top: 1.2vmin; }
  .list { position: relative; list-style: none; margin-top: 4vmin; display: flex; flex-direction: column; gap: 2.6vmin; }
  .item { display: flex; align-items: center; gap: 2.6vmin; font-size: 5vmin; font-weight: 700; line-height: 1.15;
    opacity: 0; animation: item-in .45s cubic-bezier(.2, .9, .25, 1.1) both; }
  .item .ic { width: 8vmin; height: 8vmin; flex: none; padding: 1.6vmin; border-radius: 2vmin;
    background: color-mix(in srgb, var(--tone, var(--accent)) 22%, transparent); color: var(--tone, var(--accent)); }
  .item.good { --tone: var(--good); }
  .item.bad { --tone: var(--bad); }
  .item.bad .txt { text-decoration: line-through; text-decoration-thickness: .5vmin; text-decoration-color: var(--bad); color: rgba(255, 255, 255, .7); }
  @keyframes item-in { from { opacity: 0; transform: translateX(-6vmin); } to { opacity: 1; transform: none; } }
</style></head>
<body>
  <!-- The panel itself is opaque from the first frame: the person crop switches on a hard cut,
       so a fading panel would show the uncropped head behind it for the length of the fade. -->
  <div class="panel">
    <div class="grid"></div>
    <div class="life">
      <div class="kicker" data-p="kicker"></div>
      <div class="title" data-p="title"></div>
      <ul class="list"></ul>
    </div>
  </div>
  <script src="overlay.js"></script>
  <script>
    const { params, icon } = window.OVERLAY;
    const list = document.querySelector('.list');
    (params.items || []).forEach((item, i) => {
      const li = document.createElement('li');
      li.className = 'item' + (item.tone ? ' ' + item.tone : '');
      li.style.animationDelay = (item.at ?? 0.4 + i * 0.5) + 's';
      li.innerHTML = `<span class="ic">${icon(item.icon || 'check')}</span><span class="txt"></span>`;
      li.querySelector('.txt').textContent = item.text;
      list.appendChild(li);
    });
  </script>
</body></html>
