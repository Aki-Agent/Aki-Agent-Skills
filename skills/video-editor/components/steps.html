<!doctype html>
<!-- Numbered steps that appear one by one. Tall: use it as a split panel ("bg") or on a horizontal frame.
     See components/README.md.
     Params: title, kicker, items [{text, at}] (at = seconds after the clip starts; default 0.4 + 0.6 * index),
             top (default .05), bg, theme, accent, ink, card, dur -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="overlay.css">
<style>
  :root { --top: .05; }
  .slot { position: absolute; left: 6%; right: 6%; top: calc(var(--top) * 100%); }
  .card { background: var(--card); border-radius: 3vmin; padding: 3vmin 4vmin; box-shadow: 0 .8vmin 2.4vmin rgba(0, 0, 0, .35); }
  body.solid .card { background: none; box-shadow: none; padding: 2vmin 1vmin; }
  .kicker { color: var(--accent); font-size: 3.4vmin; font-weight: 800; letter-spacing: .3vmin; text-transform: uppercase; }
  .title { font-size: 6.4vmin; font-weight: 900; line-height: 1.1; margin-top: .8vmin; }
  ol { list-style: none; margin-top: 3vmin; display: flex; flex-direction: column; gap: 2.4vmin; }
  li { display: flex; align-items: center; gap: 2.6vmin; font-size: 4.8vmin; font-weight: 700; line-height: 1.15;
    animation: step-in .45s cubic-bezier(.2, .9, .25, 1.15) both; }
  .n { width: 8vmin; height: 8vmin; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: var(--accent); color: #111; font-weight: 900; font-size: 4.4vmin; }
  @keyframes step-in { from { opacity: 0; transform: translateY(3vmin); } to { opacity: 1; transform: none; } }
</style></head>
<body>
  <div class="slot"><div class="card life">
    <div class="kicker" data-p="kicker"></div>
    <div class="title" data-p="title"></div>
    <ol></ol>
  </div></div>
  <script src="overlay.js"></script>
  <script>
    const p = window.OVERLAY.params;
    if (p.bg) document.body.classList.add('solid');
    (p.items || []).forEach((item, i) => {
      const li = document.createElement('li');
      li.style.animationDelay = (item.at ?? 0.4 + i * 0.6) + 's';
      li.innerHTML = '<span class="n"></span><span class="t"></span>';
      li.querySelector('.n').textContent = i + 1;
      li.querySelector('.t').textContent = item.text;
      document.querySelector('ol').appendChild(li);
    });
  </script>
</body></html>
