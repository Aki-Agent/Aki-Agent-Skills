<!doctype html>
<!-- Horizontal timeline whose milestones appear in order. Up to 4 items on a vertical frame, 6 on a horizontal one.
     See components/README.md.
     Params: title, items [{date, text, at}] (at = seconds after the clip starts; default 0.5 + 0.6 * index),
             current (index of the milestone drawn in accent as "now"), top (default .015), bg, theme, accent, ink, card, dur -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="overlay.css">
<style>
  :root { --top: .015; }
  .slot { position: absolute; left: 4%; right: 4%; top: calc(var(--top) * 100%); }
  .card { background: var(--card); border-radius: 3vmin; padding: 2.4vmin 3vmin 2.6vmin; box-shadow: 0 .8vmin 2.4vmin rgba(0, 0, 0, .35); }
  body.solid .card { background: none; box-shadow: none; }
  .title { font-size: 4.4vmin; font-weight: 900; margin-bottom: 2vmin; }
  .track { position: relative; display: flex; }
  .line { position: absolute; left: 0; right: 0; top: 2.2vmin; height: .7vmin; background: rgba(127, 127, 127, .45);
    border-radius: 1vmin; transform-origin: left; animation: grow 1.2s cubic-bezier(.4, .2, .2, 1) .2s both; }
  .m { position: relative; flex: 1; text-align: center; padding: 0 1vmin; animation: m-in .4s cubic-bezier(.2, .9, .25, 1.2) both; }
  .dot { width: 5vmin; height: 5vmin; margin: 0 auto; border-radius: 50%; background: var(--ink); border: 1vmin solid var(--card); }
  .m.now .dot { background: var(--accent); box-shadow: 0 0 0 1vmin color-mix(in srgb, var(--accent) 35%, transparent); }
  .date { margin-top: 1.2vmin; font-size: 3.8vmin; font-weight: 900; color: var(--accent); }
  .txt { margin-top: .4vmin; font-size: 3vmin; font-weight: 600; color: var(--muted); line-height: 1.2; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes m-in { from { opacity: 0; transform: translateY(2vmin) scale(.8); } to { opacity: 1; transform: none; } }
</style></head>
<body>
  <div class="slot"><div class="card life">
    <div class="title" data-p="title"></div>
    <div class="track"><div class="line"></div></div>
  </div></div>
  <script src="overlay.js"></script>
  <script>
    const p = window.OVERLAY.params;
    if (p.bg) document.body.classList.add('solid');
    (p.items || []).forEach((item, i) => {
      const m = document.createElement('div');
      m.className = 'm' + (p.current === i ? ' now' : '');
      m.style.animationDelay = (item.at ?? 0.5 + i * 0.6) + 's';
      m.innerHTML = '<div class="dot"></div><div class="date"></div><div class="txt"></div>';
      m.querySelector('.date').textContent = item.date || '';
      if (item.text) m.querySelector('.txt').textContent = item.text; else m.querySelector('.txt').remove();
      document.querySelector('.track').appendChild(m);
    });
  </script>
</body></html>
