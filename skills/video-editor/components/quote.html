<!doctype html>
<!-- Quote card: what someone said, with attribution. See components/README.md.
     Params: text (required), author, role, top (default .015), theme, accent, ink, card, dur.
     Keep text to two lines on a vertical talking head (about 60 characters), or the card reaches the face. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="overlay.css">
<style>
  :root { --top: .015; }
  .slot { position: absolute; left: 6%; right: 6%; top: calc(var(--top) * 100%); display: flex; justify-content: center; }
  .card { position: relative; background: var(--card); border-radius: 3vmin; padding: 3vmin 4vmin 2.8vmin 9vmin;
    box-shadow: 0 .8vmin 2.4vmin rgba(0, 0, 0, .35); max-width: 100%; }
  .mark { position: absolute; left: 2.2vmin; top: -1.6vmin; font-size: 16vmin; line-height: 1; font-weight: 900;
    color: var(--accent); font-family: Georgia, "Times New Roman", serif; }
  .text { font-size: 5vmin; font-weight: 700; line-height: 1.2; font-style: italic; }
  .who { margin-top: 1.4vmin; font-size: 3.4vmin; font-weight: 800; color: var(--accent); }
  .role { font-weight: 600; color: var(--muted); }
</style></head>
<body>
  <div class="slot"><div class="card life">
    <div class="mark">“</div>
    <div class="text" data-p="text"></div>
    <div class="who"><span data-p="author"></span> <span class="role" data-p="role"></span></div>
  </div></div>
  <script src="overlay.js"></script>
  <script>
    const p = window.OVERLAY.params;
    if (!p.author && !p.role) document.querySelector('.who').remove();
    else if (p.author && p.role) document.querySelector('.role').textContent = '· ' + p.role;
  </script>
</body></html>
