<!doctype html>
<!-- Full-frame grid of big figures (2-6) that count up. Replaces the footage.
     Use only figures the video states. See components/README.md ("Screens").
     Params: items [{value, label, text, icon, prefix, suffix, decimals, display, at}]
               value   = number to count to; display = fixed text instead of a number ("4K", "24/7")
               at      = seconds after the screen opens when the tile appears
             count (seconds each count takes, default 1.2), title, kicker, icon, text, note, source,
             locale, theme, accent, bg, panel, pattern, font, dur -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="overlay.css">
<link rel="stylesheet" href="screen.css">
<style>
  .grid { display: grid; gap: 3vmin; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); }
  .stat { padding: 3.6vmin 3.6vmin 3.4vmin; display: flex; flex-direction: column; gap: .8vmin; border-top: .9vmin solid var(--accent); }
  .stat .ic { width: 6vmin; height: 6vmin; color: var(--accent); margin-bottom: .8vmin; }
  .num { font-size: 11vmin; font-weight: 900; line-height: 1.15; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
  body.landscape .num { font-size: 9vmin; }
  .grid.many .num { font-size: 8.4vmin; }
  .lab { font-size: 4.2vmin; font-weight: 800; line-height: 1.15; }
  .txt { font-size: 3.2vmin; color: var(--muted); line-height: 1.3; }
</style></head>
<body>
  <div class="screen life">
    <div class="deco"></div>
    <div class="head rise">
      <div class="kicker"><span class="ic" data-icon="icon"></span><span data-p="kicker"></span></div>
      <div class="title" data-p="title"></div>
      <div class="text" data-p="text"></div>
    </div>
    <div class="body"><div class="grid"></div></div>
    <div class="foot rise" style="--d: 1s"><span data-p="note"></span><span class="source" data-p="source"></span></div>
  </div>
  <script src="overlay.js"></script>
  <script src="screen.js"></script>
  <script>
    const { params: p, icon, landscape, el, at, fmt } = window.SCREEN;
    const items = p.items || [];
    const grid = document.querySelector('.grid');
    // Vertical: one column up to 3 figures, two columns for more. Horizontal: one row up to 4.
    const cols = landscape ? Math.min(items.length, items.length > 4 ? 3 : 4) : (items.length > 3 ? 2 : 1);
    grid.style.setProperty('--cols', Math.max(1, cols));
    if (items.length > 4 || (!landscape && items.length > 3)) grid.classList.add('many');
    const counters = [];
    items.forEach((item, i) => {
      const start = at(item, i, 0.4, 0.3);
      const tile = grid.appendChild(el('div', 'stat tile rise'));
      tile.style.setProperty('--d', start + 's');
      if (item.icon && icon(item.icon)) tile.appendChild(el('span', 'ic')).innerHTML = icon(item.icon);
      const num = tile.appendChild(el('div', 'num', item.display ?? ''));
      tile.appendChild(el('div', 'lab', item.label));
      if (item.text) tile.appendChild(el('div', 'txt', item.text));
      if (item.display === undefined) counters.push({ num, item, start });
    });
    const secs = +p.count || 1.2;
    const show = ({ num, item }, v) => { num.textContent = (item.prefix || '') + fmt(v, item.decimals) + (item.suffix || ''); };
    counters.forEach(c => show(c, +c.item.from || 0));
    const t0 = performance.now();
    // Ease-out count driven by the renderer's virtual clock.
    const tick = () => {
      const now = (performance.now() - t0) / 1000;
      let running = false;
      counters.forEach(c => {
        const k = Math.max(0, Math.min(1, (now - c.start - 0.15) / secs));
        const from = +c.item.from || 0;
        show(c, from + ((+c.item.value || 0) - from) * (1 - Math.pow(1 - k, 3)));
        if (k < 1) running = true;
      });
      if (running) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  </script>
</body></html>
