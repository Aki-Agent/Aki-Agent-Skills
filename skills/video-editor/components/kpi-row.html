<!doctype html>
<!-- Two to four small figures side by side in one card: "8 GB | 3 min | Free". Fixed text, no count.
     Use only figures the video states. See components/README.md.
     Params: items [{value, label, icon}] (required; value is the text shown big, e.g. "16 GB"),
             title (line above the row), highlight (index drawn in accent; default all in accent),
             top (default .015), x (horizontal center, default .5), w (width share; .9 vertical, .6 horizontal), theme, accent, ink, muted, card, font, dur -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="overlay.css">
<style>
  :root { --top: .015; --x: .5; --w: .9; }
  @media (orientation: landscape) { :root { --w: .6; } }
  .slot { position: absolute; left: calc((var(--x) - var(--w) / 2) * 100%); width: calc(var(--w) * 100%); top: calc(var(--top) * 100%); }
  .card { background: var(--card); border-radius: 3vmin; padding: 2.4vmin 2vmin 2.6vmin; box-shadow: 0 .8vmin 2.4vmin rgba(0, 0, 0, .35); }
  .title { text-align: center; font-size: 3.6vmin; font-weight: 800; color: var(--muted); margin-bottom: 1.6vmin; }
  .row { display: flex; }
  .kpi { flex: 1; min-width: 0; text-align: center; padding: 0 1.6vmin; animation: enter-up .45s both; }
  .kpi + .kpi { border-left: .3vmin solid rgba(127, 127, 127, .35); }
  .kpi .ic { display: block; width: 4.6vmin; height: 4.6vmin; margin: 0 auto .8vmin; color: var(--accent); }
  .val { font-size: 7vmin; font-weight: 900; line-height: 1.15; color: var(--accent); white-space: nowrap; }
  .kpi.dim .val { color: var(--ink); }
  .lab { font-size: 3.2vmin; font-weight: 700; color: var(--muted); margin-top: .8vmin; line-height: 1.15; }
</style></head>
<body>
  <div class="slot"><div class="card life">
    <div class="title" data-p="title"></div>
    <div class="row"></div>
  </div></div>
  <script src="overlay.js"></script>
  <script>
    const { params: p, icon } = window.OVERLAY;
    const row = document.querySelector('.row');
    const items = p.items || [];
    // Long values shrink together so the row stays one line on a vertical frame.
    const longest = Math.max(1, ...items.map(i => String(i.value ?? '').length));
    const size = Math.min(7, 60 / (items.length * Math.max(3, longest) * 0.62));
    items.forEach((item, i) => {
      const kpi = document.createElement('div');
      kpi.className = 'kpi' + (p.highlight !== undefined && +p.highlight !== i ? ' dim' : '');
      kpi.style.animationDelay = (0.25 + i * 0.15) + 's';
      if (icon(item.icon)) kpi.appendChild(document.createElement('span')).outerHTML = `<span class="ic">${icon(item.icon)}</span>`;
      const val = kpi.appendChild(document.createElement('div'));
      val.className = 'val';
      val.style.fontSize = size + 'vmin';
      val.textContent = item.value ?? '';
      const lab = kpi.appendChild(document.createElement('div'));
      lab.className = 'lab';
      lab.textContent = item.label ?? '';
      row.appendChild(kpi);
    });
  </script>
</body></html>
