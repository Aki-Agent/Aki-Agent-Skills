<!doctype html>
<!-- Keyword chips popping in one by one, wrapped and centered: topics, tools, tags.
     See components/README.md.
     Params: items (required) ["Python", "Docker"] or [{text, icon, at, tone}]
               at   = seconds after the event starts when the chip appears (sync it to the word)
               tone = "accent" fills the chip with the accent color
             title (line above), variant ("solid" default | "outline"), top (default .02), y (instead of top:
             vertical center, share of the height), theme, accent, ink, card, font, dur -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="overlay.css">
<style>
  :root { --top: .02; }
  .slot { position: absolute; left: 5%; right: 5%; top: calc(var(--top) * 100%); }
  body.centered .slot { top: calc(var(--y) * 100%); transform: translateY(-50%); }
  .box { position: absolute; inset: 0; }
  .title { text-align: center; font-size: 4.6vmin; font-weight: 900; margin-bottom: 1.8vmin; text-shadow: 0 .3vmin 1.6vmin rgba(0, 0, 0, .6); }
  .wrap { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.6vmin; }
  .chip { display: inline-flex; align-items: center; gap: 1.2vmin; padding: 1.4vmin 2.8vmin; border-radius: 99vmin;
    background: var(--card); font-size: 4vmin; font-weight: 800; box-shadow: 0 .6vmin 1.8vmin rgba(0, 0, 0, .3);
    animation: enter-pop .45s both; }
  .chip svg { width: 4.2vmin; height: 4.2vmin; color: var(--accent); }
  body.outline .chip { background: rgba(0, 0, 0, .25); border: .5vmin solid var(--accent); }
  .chip.accent { background: var(--accent); color: #111; }
  .chip.accent svg { color: #111; }
</style></head>
<body>
  <!-- .life on a full-frame wrapper: the centered slot has its own transform, which the exit animation would replace. -->
  <div class="box life"><div class="slot">
    <div class="title" data-p="title"></div>
    <div class="wrap"></div>
  </div></div>
  <script src="overlay.js"></script>
  <script>
    const { params: p, icon } = window.OVERLAY;
    if (p.y !== undefined) document.body.classList.add('centered');
    if (p.variant === 'outline') document.body.classList.add('outline');
    const wrap = document.querySelector('.wrap');
    (p.items || []).forEach((raw, i) => {
      const item = typeof raw === 'string' ? { text: raw } : raw;
      const chip = document.createElement('span');
      chip.className = 'chip' + (item.tone === 'accent' ? ' accent' : '');
      chip.style.animationDelay = (item.at ?? 0.3 + i * 0.18) + 's';
      chip.innerHTML = icon(item.icon);
      chip.appendChild(document.createElement('span')).textContent = item.text;
      wrap.appendChild(chip);
    });
  </script>
</body></html>
