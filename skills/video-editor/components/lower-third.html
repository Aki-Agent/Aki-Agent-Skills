<!doctype html>
<!-- Name/role bar that introduces a person or a source. See components/README.md.
     Params: name (required), role, icon, top (0-1, default .70), side ("left" | "right"), theme, accent, ink, card, dur -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="overlay.css">
<style>
  :root { --top: .70; --enter: lt-in; --leave: leave-only-fade; --in: .55s; }
  .slot { position: absolute; left: 5%; right: 5%; top: calc(var(--top) * 100%); display: flex; }
  body.right .slot { justify-content: flex-end; }
  .bar { display: flex; align-items: stretch; background: var(--card); border-radius: 1.6vmin; overflow: hidden;
    box-shadow: 0 .8vmin 2.4vmin rgba(0, 0, 0, .35); max-width: 100%; }
  .strip { width: 1.6vmin; background: var(--accent); flex: none; transform-origin: top; animation: strip .4s ease-out both; }
  .body { padding: 2vmin 3.4vmin 2.2vmin 2.6vmin; display: flex; gap: 2vmin; align-items: center; }
  .ic { width: 6vmin; height: 6vmin; color: var(--accent); flex: none; }
  .name { font-size: 5.2vmin; font-weight: 800; line-height: 1.1; }
  .role { font-size: 3.4vmin; color: var(--muted); font-weight: 600; margin-top: .6vmin; }
  @keyframes strip { from { transform: scaleY(0); } to { transform: none; } }
  @keyframes lt-in { from { opacity: 0; transform: translateX(-12vmin); } to { opacity: 1; transform: none; } }
</style></head>
<body>
  <div class="slot"><div class="bar life">
    <div class="strip"></div>
    <div class="body">
      <span class="ic" data-icon="icon"></span>
      <div><div class="name" data-p="name"></div><div class="role" data-p="role"></div></div>
    </div>
  </div></div>
  <script src="overlay.js"></script>
  <script>if (window.OVERLAY.params.side === 'right') document.body.classList.add('right');</script>
</body></html>
