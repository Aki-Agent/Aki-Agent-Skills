<!doctype html>
<!-- Small element over the footage: logo/wordmark pill, banner or call-to-action button.
     Params: label, sub, icon, src (logo image with alpha), variant (pill|banner|button),
     x, y (0-1 share of the frame, anchor = center), accent, dur -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="overlay.css">
<style>
  :root { --x: .5; --y: .12; --enter: enter-pop; --leave: leave-pop; }
  .anchor { position: absolute; left: calc(var(--x) * 100%); top: calc(var(--y) * 100%); transform: translate(-50%, -50%); }
  .badge { display: flex; align-items: center; gap: 2vmin; white-space: nowrap;
    padding: 2.2vmin 3.6vmin; border-radius: 10vmin; background: var(--card);
    box-shadow: 0 1.6vmin 5vmin rgba(0, 0, 0, .45); border: .4vmin solid rgba(255, 255, 255, .14); }
  .ic { width: 6vmin; height: 6vmin; color: var(--accent); flex: none; }
  .logo { height: 7vmin; width: auto; flex: none; }
  .label { font-size: 4.8vmin; font-weight: 800; }
  .sub { font-size: 3.2vmin; color: var(--muted); font-weight: 600; }
  .col { display: flex; flex-direction: column; line-height: 1.15; }

  body.banner .badge { border-radius: 2vmin; border: none; border-left: 1.2vmin solid var(--accent); }
  body.button .badge { background: var(--accent); color: #111; border: none; }
  body.button .ic { color: #111; }
  body.button .sub { color: rgba(0, 0, 0, .7); }
  body.button .badge { animation: pulse 1.2s ease-in-out .6s infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, .55); } 50% { box-shadow: 0 0 0 2.4vmin rgba(255, 255, 255, 0); } }
</style></head>
<body>
  <div class="anchor"><div class="life"><div class="badge">
    <img class="logo" data-src="src">
    <span class="ic" data-icon="icon"></span>
    <div class="col"><span class="label" data-p="label"></span><span class="sub" data-p="sub"></span></div>
  </div></div></div>
  <script>
    // Before overlay.js runs: drop the <img> when no logo is given, instead of reporting a missing param.
    const p = JSON.parse(decodeURIComponent(location.hash.slice(1) || '{}'));
    if (!p.src) document.querySelector('.logo').remove();
    document.body.classList.add(p.variant || 'pill');
  </script>
  <script src="overlay.js"></script>
</body></html>
